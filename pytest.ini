# Test configuration for THIS repository's own tooling.
#
# Not the template: the canonical configuration a consuming project copies is
# enforce/templates/pyproject.toml, which is kept in a directory holding no Python
# so pytest's rootdir search never reaches it. This file exists only so `pytest`
# run from the repo root collects tools/ and enforce/ without their same-named
# modules colliding.

[pytest]
testpaths = tools enforce
addopts = --import-mode=importlib --strict-markers --disable-socket -ra
# Corpus-wide checks parse hundreds of evidence records and can exceed five
# seconds on Windows-backed filesystems. Individual subprocess and mutation
# tests retain their larger explicit bounds; 30 seconds still fails closed on
# an unbounded ordinary unit test.
timeout = 30
timeout_method = thread
filterwarnings = error
