# Test configuration for THIS repository's own tooling.
#
# Not the template: the canonical configuration a consuming project copies is
# enforce/pyproject.toml. This file exists only so `pytest` run from the repo root
# collects tools/ and enforce/ without their same-named modules colliding.

[pytest]
testpaths = tools enforce
addopts = --import-mode=importlib --strict-markers -ra
filterwarnings = error
