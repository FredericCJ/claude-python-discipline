#  Canonical enforcement configuration. A TEMPLATE, not live configuration.
#
#  Copy the [tool.*] tables into a consuming project's pyproject.toml. Every stanza
#  names the discipline rules it enforces, so a rule can be traced to its mechanism
#  and back. Rule ids are stable; grep discipline/INDEX.md for one.
#
#  It lives under enforce/templates/ because ruff and pytest resolve configuration
#  from the nearest ANCESTOR directory of the file being processed. In enforce/ it
#  was an ancestor of enforce/checks/, so it silently governed this repository's own
#  code -- and, once vendored, .agent/enforce/. A directory holding no Python is an
#  ancestor of nothing either tool processes, which removes it from discovery while
#  leaving it obviously a template.
#
#  Posture is the hardest setting that can be sustained. Each relaxation below is
#  individually justified; an unjustified ignore is a defect, not a preference.

# ------------------------------------------------------------ the declaration
#
#  What this project says about its own conventions. The AST checks under
#  enforce/checks/ read it; nothing else does.
#
#  The declaration identifies exactly one governed repository. Capabilities add
#  obligations later in this file; none of these fields switches a kernel rule off.
#
#  * `unit` is the repository's product shape: a complete application or one
#    independently testable component. It never denotes several components.
#  * `source_roots` bounds all production Python inspected by role-scoped checks.
#  * `roles` maps repository-relative paths onto the four executable roles and
#    the port-contract role. An uncovered source path fails; it never disappears.
#  * `doc_engine` names what reads this project's documentation comments.
#    DOC-001 and DOC-003 -- every element is documented -- apply whatever it
#    says. DOC-002 and DOC-007 describe Doxygen's own syntax (the `##` block,
#    the @param/@return tags) and apply only under `doxygen`, because demanding
#    one engine's punctuation from a project using another produced 1,064
#    findings of form against 18 of substance on a real codebase.
#
#  A check running with a rule narrowed by this table announces it on stdout. A
#  reduced scan that looks like a clean one is the failure this table exists to
#  prevent, not to cause.

[tool.agent-discipline]
unit = "application"              # application | component
source_roots = ["src"]
doc_engine = "doxygen"             # doxygen | sphinx | none.  Absent => none.
pedagogical_full_projection = false

[tool.agent-discipline.roles]
# Replace `package` with the distribution's import package. Paths, rather than
# guessed directory names, make full source coverage mechanically decidable.
domain = ["src/package/domain"]
application = ["src/package/app"]
ports = ["src/package/ports"]
adapters = ["src/package/adapters"]
shell = ["src/package/shell"]

# ---------------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py311"           # law/DEP; floor decided in discipline/meta/OPEN.md
preview = true
src = ["src", "tests"]

[tool.ruff.lint]
# Everything, then subtract with a reason. Enables the rules the discipline names:
# BLE001 broad-except (DIAG-008, ERR-008), E722 bare-except (DIAG-008),
# S110 try-except-pass (DIAG-008), S101 assert (DIAG-009, ERR-012),
# G004/G010 eager log formatting (DIAG-012, DIAG-015),
# TRY300/TRY301 try-body scope (ERR-009), C901 complexity (ARCH-016),
# PGH003 blanket type-ignore (TYPE-003).
select = ["ALL"]

ignore = [
    # NOTE: docstring presence was previously relaxed here, on the grounds that a
    # blanket requirement produces ceremonial docstrings. That decision is
    # REVERSED -- see discipline/meta/OPEN.md OPEN-007. law/DOC now requires a
    # documentation comment on every element, and answers the ceremony objection
    # with DOC-009 (say the contract, not the name) rather than with an exemption.
    # D100 and D104 are therefore NOT ignored.
    #
    # Conflicts with the formatter; the formatter wins.
    "missing-trailing-comma", "single-line-implicit-string-concatenation",
    # Mutually exclusive pydocstyle pairs; one of each must go. Keeping
    # blank-line-before-class and multi-line-summary-first-line.
    "incorrect-blank-line-before-class", "multi-line-summary-second-line",
    # These demand a Google-style `Returns:` / `Yields:` / `Raises:` section, which
    # full-featured Doxygen cannot read. The discipline uses @return / @throws
    # instead, and completeness is decided by enforce/checks/doc_coverage.py.
    # NOT by Doxygen's WARN_NO_PARAMDOC, which an earlier version of this comment
    # named: that flag cannot see that `-> None` is void and demands an @return
    # from every procedure (fact/doxygen). doc_coverage reads the annotation, so
    # it asks only for what is actually returned, and it also flags a parameter
    # documented under a name the signature does not have.
    "docstring-missing-returns", "docstring-missing-yields",
    "docstring-missing-exception",
    # DOC-002 requires a `##` block on every element Python gives no docstring
    # slot -- a module constant, a dataclass field, an enum member. It is the only
    # form Doxygen reads for them, so this rule and DOC-002 cannot both be obeyed.
    # DOC-002 wins: it is load-bearing for the documentation build, and this rule
    # is a stylistic preference about how many `#` a comment opens with.
    "multiple-leading-hashes-for-block-comment",
    # `Any` is banned outright in the domain by TYPE-002 via mypy, which can see
    # implicit Any that a linter cannot. Duplicate reporting here adds noise only.
    "any-type",
    # The imperative-mood rule demands "Return the exception types a handler
    # names" where DOC-009 asks for "The exception types a handler names".
    # On an accessor-shaped function the noun phrase IS the contract -- it says
    # what the value is -- while the imperative narrates the mechanism, which is
    # the half that rule explicitly rejects and which is wrong after the first
    # refactor. The two cannot both be obeyed there, and the discipline's is a
    # binding rule with a mechanism (checks.doc_style) where this is a
    # preference about grammar.
    #
    # Narrow in what it gives up: the summary-line rules stay on, so a first line
    # must still be a single, complete, properly closed sentence. Only its
    # grammatical mood is unconstrained.
    "non-imperative-mood",
    # The error-suffix rule demands every exception class end in `Error`. The
    # discipline's own error taxonomy, settled in the conflict ledger as
    # CONF-002, contains no such name: NotFound, InvalidCommand,
    # InvariantViolation, Conflict, PortFailure, ContractViolation,
    # UnsupportedSchema, CorruptModel. Those names are published surface -- an
    # error code and a variant name are versioned contract -- so renaming them
    # to satisfy a linter would be a breaking change made for punctuation.
    # Surfaced by building the reference package, where all four of its
    # exception names were flagged.
    "error-suffix-on-exception-name",
    # The no-self-use rule advises that a method not touching `self` "could be a
    # function". For a class implementing a Protocol the signature is fixed by
    # the contract, and taking that advice would stop the class satisfying it.
    # A stateless adapter -- a clock is the obvious one -- has no `self` to use
    # and is not thereby a design fault.
    #
    # It is worth reading before dismissing: on the reference package it also
    # flagged a store whose `delete` ignored its own root, which was a real
    # encapsulation defect and was fixed rather than ignored.
    "no-self-use",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is their job. S101 stays on everywhere else, which is what
# DIAG-009 and ERR-012 actually require.
# DOC-001 applies to tests too: a test module states its oracle (TEST-004) and a
# test states the behaviour it pins. Only the assert and magic-value relaxations
# survive here.
"tests/**/*.py" = ["assert", "magic-value-comparison"]
"enforce/fitness/*.py" = ["assert"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"       # ARCH-001: layer edges must be visible in the import

[tool.ruff.lint.mccabe]
max-complexity = 10                # ARCH-016

[tool.ruff.lint.pydocstyle]
# DELIBERATELY no convention. A convention makes the linter demand Google- or
# NumPy-style section headings, which full-featured Doxygen cannot read without an
# input filter (fact/doxygen). Parameter and return completeness is checked by the
# engine itself via WARN_NO_PARAMDOC, which is the mechanism that tests the actual
# requirement rather than a proxy for it.

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.11"
strict = true                      # TYPE-001

# Beyond strict. Each of these is off by default and each closes a hole the
# discipline depends on being closed.
disallow_any_explicit = true       # TYPE-002
disallow_any_decorated = true      # TYPE-002: a decorator must not launder a type
disallow_any_unimported = true     # TYPE-002: an untyped stub is an Any factory
warn_unreachable = true            # ERR-002: unreachable code often means a union
                                   #          member was already narrowed away
extra_checks = true
strict_bytes = true
strict_equality = true             # TYPE-013
warn_redundant_casts = true        # TYPE-003
warn_unused_ignores = true         # TYPE-003
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "ignore-without-code",         # TYPE-003: an ignore must name what it suppresses
    "possibly-undefined",
    "unused-awaitable",
    "explicit-override",
    "mutable-override",
    "comparison-overlap",
]
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# The domain is the layer whose errors must be trustworthy, so it gets no relief.
module = "*.domain.*"
disallow_any_expr = true           # TYPE-002, at its strictest

# --------------------------------------------------------------------------- pyright

[tool.pyright]
typeCheckingMode = "strict"        # TYPE-001: a second, differently-inferring oracle
pythonVersion = "3.11"
include = ["src"]
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownParameterType = "error"
reportMissingTypeStubs = "error"
reportImplicitOverride = "error"
reportUnnecessaryTypeIgnoreComment = "error"   # TYPE-003

# --------------------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests", "enforce/fitness"]
addopts = [
    "--strict-markers",            # fact/py-testing: an unregistered marker selects
    "--strict-config",             #   nothing and the suite passes by running none
    "--import-mode=importlib",
    "-ra",
]
markers = [
    "unit: pure domain, no external resource (TEST-001)",
    "contract: one port, run against every adapter (TEST-005)",
    "integration: one real external technology",
    "fault: faulty adapters driven by fault schedules (TEST-009)",
    "property: generated inputs (TEST-007)",
    "fitness: architectural constraints (ARCH-*, TEST-002)",
]
# TEST-017: order dependence and ambient network are hidden inputs. Both fail closed.
# TEST-003: the per-test budget is a proxy for the architecture, not for speed.
timeout = 5
timeout_method = "thread"
filterwarnings = ["error"]

# ------------------------------------------------------------------------- coverage

[tool.coverage.run]
branch = true                      # line coverage alone cannot see an untaken branch
source = ["src"]

[tool.coverage.report]
# Deliberately no fail_under. fact/py-testing records why: a numeric target is easy
# to reach with low-quality tests, and TEST-002 gates on artifact coverage while
# TEST-013 gates on mutation score. Those discriminate; a percentage does not.
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# ------------------------------------------------------------------------ doxygen
#
# law/DOC is enforced by three mechanisms, each covering what the others cannot:
#   ruff D1xx                 docstring presence (module, class, callable)
#   checks/doc_coverage.py    the elements with no docstring slot -- module
#                             constants, class attributes, dataclass fields,
#                             enum members -- which no linter sees
#   doxygen enforce/Doxyfile  parseability, and parameter/return completeness
#
# The first two run in the ordinary gate and need no Doxygen installed, which is
# what DOC-003 requires: the comments are in the code whether or not documentation
# is ever generated.

# -------------------------------------------------------------------------- mutmut

[tool.mutmut]
# TEST-013. Scoped to the domain: it is the layer whose logic the suite must be
# shown to discriminate, and the layer where a surviving mutant is cheapest to fix.
paths_to_mutate = ["src/*/domain/"]
tests_dir = "tests/unit/"
