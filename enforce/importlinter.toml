#  Architecture as a checked contract.
#
#  Run with `lint-imports --config enforce/importlinter.toml`.
#  Replace `mypkg` with the consuming package's name; nothing else needs editing.
#
#  These four contracts are the mechanism behind law/ARCH. Together they are what
#  "push coupling to the very edge" means operationally: a foreign library reachable
#  from anywhere but its one adapter fails the build, which is the property that
#  makes a stack trace's layer attribution trustworthy.

[tool.importlinter]
root_packages = ["mypkg"]
include_external_packages = true

# ARCH-001 -- dependencies point inward only.
[[tool.importlinter.contracts]]
name = "ARCH-001 layers point inward"
type = "layers"
layers = [
    "mypkg.shell",
    "mypkg.adapters",
    "mypkg.app",
    "mypkg.domain",
]
exhaustive = true

# ARCH-002, EFCT-001, DEP-001 -- the domain imports nothing that can perform I/O,
# nothing from an adapter, and no third-party package. A domain failure that can
# originate outside the domain is a domain failure that localizes nothing.
[[tool.importlinter.contracts]]
name = "ARCH-002 domain is pure"
type = "forbidden"
source_modules = ["mypkg.domain"]
forbidden_modules = [
    "mypkg.adapters",
    "mypkg.shell",
    "os",
    "io",
    "pathlib",
    "socket",
    "subprocess",
    "shutil",
    "tempfile",
    "sqlite3",
    "http",
    "urllib",
    "asyncio",
    "threading",
    "multiprocessing",
    "random",
    "secrets",
    "time",
    "datetime",
    "logging",
]
allow_indirect_imports = false

# ARCH-003 -- no adapter imports another adapter. Independent adapters are what
# make "a misbehaving component cannot contaminate a healthy one" testable.
# List every adapter module; the contract is only as complete as this list.
[[tool.importlinter.contracts]]
name = "ARCH-003 adapters are independent"
type = "independence"
modules = [
    "mypkg.adapters.filesystem",
    "mypkg.adapters.clock",
    "mypkg.adapters.process",
]

# ARCH-004, DEP-002 -- each foreign dependency is reachable from exactly one
# adapter. The pairing of package to owning adapter is the dependency register
# DEP-002 requires.
#
# DO NOT LEAVE THIS LIST EMPTY. An empty `forbidden_modules` forbids nothing, so
# the contract passes on every tree forever -- and this file shipped that way,
# with a comment saying an empty list merely meant nothing had been registered
# yet. Two rules were counted as decided on the strength of a check that could
# not fail.
#
# Derive it rather than remembering it:
#
#     python .agent/tools/register_deps.py --root . --emit    # the body below
#     python .agent/tools/register_deps.py --root . --check   # fails when stale
#
# `--check` fails when the tree imports something this list does not name, which
# is what stops the register decaying back to empty one dependency at a time.
[[tool.importlinter.contracts]]
name = "ARCH-004 foreign dependencies are cornered"
type = "forbidden"
source_modules = [
    "mypkg.domain",
    "mypkg.app",
    "mypkg.shell",
]
forbidden_modules = [
    # Generated by `register_deps.py --emit`; each entry must be importable from
    # its one owning adapter and nowhere else. Replace these with your own -- they
    # are the three most common, listed so the contract bites before you have run
    # anything at all.
    "httpx",
    "requests",
    "pydantic",
]
allow_indirect_imports = false

# EFCT-012, API-004 -- persistent state has exactly one owning path. Two writers
# make every corruption a question of which one did it.
[[tool.importlinter.contracts]]
name = "EFCT-012 storage has one owner"
type = "forbidden"
source_modules = [
    "mypkg.domain",
    "mypkg.app",
    "mypkg.shell",
]
forbidden_modules = ["mypkg.adapters.filesystem.raw"]
allow_indirect_imports = false
