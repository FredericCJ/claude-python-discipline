[mypy]
python_version = 3.11
strict = True
show_error_codes = True
warn_unreachable = False
warn_unused_ignores = True
enable_error_code = ignore-without-code

# TYPE-002 is deliberately strictest in the domain. The shell's JSON envelope
# remains outside this narrow fixture claim; adopter projects consume the full
# canonical pyproject configuration through the project gate.
[mypy-refpkg.domain.*]
disallow_any_explicit = True
