#  The reference package's own declaration, and nothing else.
#
#  DELIBERATELY NOT A CONFIGURATION FILE, for the same reason the repository root
#  one is not: ruff and pytest resolve configuration from the nearest ANCESTOR of
#  the file being processed, so a [tool.ruff] or [tool.pytest.ini_options] table
#  here would silently govern everything under this directory and diverge from
#  the repository's own posture. The canonical enforcement configuration an
#  adopter copies is enforce/templates/pyproject.toml.
#
#  The layer table is empty because this package uses the canonical names -- it
#  is the reference, so it demonstrates the default rather than the escape. A
#  project laying its code out as services/ and composition/ maps them here; see
#  the commented example in the template.

[tool.agent-discipline]
unit = "application"
source_roots = ["src"]
architecture = "architecture.json"
contract_conformance = "contract-conformance.json"
operational_model = "operational-model.json"
security_model = "security-model.json"
adversarial_review = "adversarial-review.json"
doc_engine = "doxygen"
adapter_boundaries = [
    "src/refpkg/adapters/clock",
    "src/refpkg/adapters/files",
]

[tool.agent-discipline.capabilities]
public_api = true
filesystem_io = true
persistent_state = false
generated_artifacts = false
network_io = false
launches_subprocesses = false
owns_subprocess_lifecycle = false
concurrency = false
destructive_effects = true
bounded_latency = false
sensitive_data = false

[tool.agent-discipline.roles]
domain = ["src/refpkg/domain"]
application = ["src/refpkg/app"]
ports = ["src/refpkg/ports"]
adapters = ["src/refpkg/adapters"]
shell = ["src/refpkg/__init__.py", "src/refpkg/shell"]

[[tool.agent-discipline.foreign_dependencies]]
import_name = "time"
owner = "src/refpkg/adapters/clock"
