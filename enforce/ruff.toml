#  Lint configuration for THIS repository's own code under enforce/.
#
#  It exists to stop `enforce/pyproject.toml` from being applied to us. That file
#  is the *template* a consuming project copies, and it targets a src/ + tests/
#  layout. Ruff, however, configures each file from the nearest ancestor config,
#  and a pyproject.toml carrying a [tool.ruff] section is one -- so every file
#  under enforce/ was silently linted by the template instead of by the root
#  ruff.toml, and the root's path scoping never applied here.
#
#  That was not a harmless difference. It produced 97 findings that the root
#  config already excuses with a reason: 61 S101 (the template scopes the assert
#  exemption to tests/**, this repository keeps proof-of-failure suites beside the
#  code they prove), 24 TID252 (enforce/checks/ is a flat toolkit where
#  `from . import Check` is correct), 10 CPY001 and 2 T201. None was a defect in
#  the code; all were the wrong configuration reaching it.
#
#  Extending the root keeps one set of decisions in one place. The template is
#  still extended, transitively, because the root extends it.

extend = "../ruff.toml"
