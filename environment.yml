# The maintainer environment for this repository.
#
#     conda env create -f environment.yml
#     conda activate claude
#     python tools/check_env.py          # does the running interpreter match this file?
#
# This file is the lock. Every version below is exact, and `tools/check_env.py`
# fails when the running interpreter does not match it (DEP-005, DEP-006).
#
# WHY THIS EXISTS, stated plainly because the failure it prevents was silent:
# `tools/discipline_core.py` once imported tiktoken when present and fell back to
# a character-ratio estimate when absent, so `build_index.py` produced DIFFERENT
# GENERATED BYTES depending on what happened to be installed, and nothing said
# so. `ruff` at 0.16.2 reports 272 findings where 0.16.3 reports 275. A gate whose
# verdict moves with the machine decides nothing. Pinning is what makes a green
# run mean something.
#
# THE LIMIT, also stated plainly: this locks by exact VERSION, not by wheel
# content hash. Two installs of `ruff==0.16.3` are assumed to be the same ruff.
# Hash-level pinning needs pip-tools and `--require-hashes`; it is not done here,
# so do not read this file as proving more than it does.
#
# Only `python` comes from conda. Everything else is pip inside the conda env,
# which is how this environment was actually built -- recording it any other way
# would be a tidier lie.

name: claude

channels:
  - conda-forge

dependencies:
  # The floor is 3.11 (discipline/meta/OPEN.md OPEN-001: the version at which
  # ExceptionGroup, except*, add_note, Self and assert_never all land natively).
  # 3.13 is the tested target.
  - python=3.13.14

  # DOC-005/007/010/011. Doxygen is a native binary, not a pip package, and 1.10.0
  # is the exact version discipline/fact/doxygen.md's measurements were taken
  # against -- two enforce/Doxyfile settings are consequences of defects verified
  # at precisely this version, so a different one changes what those settings are
  # for. conda-forge carries 1.10.0 and pinning it here is not the same as
  # letting a package manager track its own latest, which is what the earlier
  # note in this file warned against.
  #
  # tools/check_env.py verifies it by RUNNING it, because importlib.metadata
  # knows nothing about a native binary. Any conda pin without a verifier there
  # is reported as unverifiable rather than waved through.
  - doxygen=1.10.0

  - pip
  - pip:
      # ---------------------------------------------------------- gate step 1
      # Lint. Named as the mechanism behind ARCH-016 (C901), DIAG-008/ERR-008
      # (BLE001), DIAG-012/015 (G004), ERR-009 (TRY300), TYPE-003 (PGH003) and
      # DOC-001/003/006 (D1xx). A version change moves the finding set, which is
      # why tools/lint_baseline.json is only meaningful beside this pin.
      - ruff==0.16.3

      # ---------------------------------------------------------- gate step 7
      - pytest==9.1.1
      # TEST-017 -- tests are order-independent and network-isolated. Both are
      # plugins rather than conventions because a convention someone forgets to
      # follow fails open; pytest-socket in particular fails closed by default
      # (discipline/meta/OPEN.md OPEN-004).
      - pytest-randomly==4.1.0
      - pytest-socket==0.8.0
      # TEST-003 -- per-test time is budgeted and enforced.
      - pytest-timeout==2.4.0

      # ------------------------------------------------- gate steps 2, 3, 4, 5
      # tools/discipline_core.py parses front-matter with PyYAML, and every
      # builder and the navigator reach it transitively.
      - PyYAML==6.0.3
      # tools/validate.py checks front-matter against tools/frontmatter.schema.json.
      - jsonschema==4.26.0

      # ---------------------------------------------------------- gate step 7
      # ARCH-001..004 and ARCH-011 as executable contracts, held against
      # enforce/fixtures/reference/ by tools/import_gate.py.
      - import-linter==2.13

      # ---------------------------------------------------------- gate step 8
      # TYPE-001. Both checkers, because OPEN-005 decided that a claim surviving
      # both is stronger than one surviving either -- and the decision earned
      # itself immediately: pyright strict found two defects in the reference
      # that mypy --strict reported clean.
      #
      # pyright PROVISIONS ITS OWN NODE on first use, downloading it. That makes
      # gate step 8 the one step in this repository that needs network access the
      # first time it runs on a machine. Stated here because a lock that hides a
      # download is not a lock.
      - mypy==2.3.0
      - pyright==1.1.407

      # --------------------------------------------------------- project gate
      # API-015. Build both wheel and sdist through the PEP 517 frontend before
      # installing the wheel into a fresh environment. The project-gate adapter
      # refuses absence as unsupported rather than silently omitting delivery.
      - build==1.3.0

      # --------------------------------------------------------- project gate
      # TEST-013. Cosmic Ray 8.7.0 is exercised natively on both Windows and
      # Linux by tools/mutation_gate.py. The wrapper independently rejects its
      # upstream ``incompetent`` outcome because Cosmic Ray's own baseline and
      # survival-rate commands otherwise count that non-verdict as green/killed.
      - cosmic-ray==8.7.0

      # ---------------------------------------------------------- gate step 9
      # Not named as any rule's mechanism, and pinned anyway: the reference
      # package's property layer imports it, and those 49 tests are collected by
      # the top-level run. Unpinned, a machine without it fails gate step 9 with
      # a collection error rather than a verdict. TEST-007 is satisfied by the
      # property layer existing and being populated, which is checked by
      # fitness:test_layers_populated, not by this package.
      - hypothesis==6.165.2

# ---------------------------------------------------------------------------
# NOT PINNED HERE, deliberately.
#
# pydantic (OPEN-002) remains unpinned.
#
# This paragraph used to cover mypy, pyright, import-linter and hypothesis too,
# and gave a reason that has since stopped being true: "this repository is a
# documentation corpus and has no src/ layout for them to check". It has one now
# -- enforce/fixtures/reference/ -- so those four moved above into gate steps 7,
# 8 and 9, where they decide something. The four rules they carry were tagged
# `external` and were being settled by nothing at all.
#
# pydantic is a consuming project's choice, not this repository's -- nothing here
# parses an external boundary.
